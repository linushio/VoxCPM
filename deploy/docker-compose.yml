version: '3.8'

services:
  voxcpm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: voxcpm-app
    restart: unless-stopped
    
    # GPU配置
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # 端口映射
    ports:
      - "8401:5000"
    
    # 环境变量配置
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      # 如果想要热更新代码，可以挂载源代码目录（开发模式）
      # - ../src:/app/src
      # - ../app.py:/app/app.py
      # - ../assets:/app/assets
      - /data/model/voxcpm/huggingface:/root/.cache/huggingface
      - /data/model/voxcpm/modelscope:/root/.cache/modelscope
      - /data:/data
    
    # 共享内存大小（对于大模型很重要）
    shm_size: '8gb'
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
